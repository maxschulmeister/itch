name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: ""
            rust_targets: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: v__VERSION__
          releaseName: "Itch v__VERSION__"
          releaseBody: "See the release page for full details. Download the app for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # The deb ships as "itch", a short name that can collide with unrelated
  # distro packages (see upstream #119). Repack it as "itch-notes" after all
  # platform builds finish.
  rename-deb-package:
    needs: build-and-release
    runs-on: ubuntu-22.04

    steps:
      # Don't persist the git token: the gh steps below only use env vars
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Repack deb as itch-notes and update release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(jq -r .version package.json)
          tag="v${version}"
          old_deb="Itch_${version}_amd64.deb"
          new_deb="itch-notes_${version}_amd64.deb"
          work=$(mktemp -d)

          gh release download "$tag" --pattern "$old_deb" --dir "$work"

          # Replaces (without Conflicts) lets dpkg take over the files of an
          # installed old-name "itch" deb.
          dpkg-deb -R "$work/$old_deb" "$work/pkg"
          sed -i 's/^Package: itch$/Package: itch-notes/' "$work/pkg/DEBIAN/control"
          grep -q '^Package: itch-notes$' "$work/pkg/DEBIAN/control"
          echo "Replaces: itch" >> "$work/pkg/DEBIAN/control"
          dpkg-deb -b --root-owner-group "$work/pkg" "$work/$new_deb"

          gh release upload "$tag" "$work/$new_deb" --clobber
          gh release delete-asset "$tag" "$old_deb" -y
